name: macOS Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    steps:
      - name: Check out tagged sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        run: make test

      - name: Build and package app
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: make package

      - name: Keep packaged files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download both architectures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-assets

      - name: Verify complete release
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          for arch in arm64 x86_64; do
            for extension in zip dmg sha256; do
              test -f "Obeshchal-${RELEASE_TAG}-macos-${arch}.${extension}"
            done
          done
          sha256sum --check ./*.sha256

      - name: Upload draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/release-notes.md"
          cat > "$notes_file" <<'NOTES'
          ## Установка

          - `arm64` — Mac с Apple Silicon (M1 и новее).
          - `x86_64` — Mac с Intel.
          - DMG содержит приложение и ссылку на Applications; ZIP содержит то же приложение.
          - Файлы `.sha256` содержат контрольные суммы ZIP и DMG.

          Требуется macOS 14+. Liquid Glass доступен на macOS 26+.

          Приложение имеет локальную ad hoc подпись. Подписи Developer ID и нотариализации
          Apple пока нет, поэтому macOS может предупредить о неизвестном разработчике.
          Подробнее: https://support.apple.com/102445
          NOTES

          if state="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$state" != true ]]; then
              echo "Релиз уже опубликован. Для новой сборки используй новый тег." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            flags=(--draft --verify-tag --title "Обещал ${RELEASE_TAG}" --generate-notes --notes-file "$notes_file")
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" release-assets/* "${flags[@]}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --verify-tag
